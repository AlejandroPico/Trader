name: Crear escritorio
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  TRADER_API_URL: ${{ vars.TRADER_API_URL }}
  TRADER_FIREBASE_CONFIG: ${{ vars.TRADER_FIREBASE_CONFIG }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
          cache: pip
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - run: pip install -r requirements-desktop.txt
      - if: runner.os == 'Linux'
        run: pip install 'pywebview[qt]==6.2.1'
      - run: python scripts/package_desktop.py
      - run: python scripts/smoke_desktop.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          if (-not $compiler) { throw "No se ha encontrado el compilador del instalador" }
          & $compiler.FullName scripts/trader.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: Trader-${{ runner.os }}-${{ runner.arch }}
          path: release/
          retention-days: 30
